<text x="40" y="480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8a8a8a" text-anchor="start">コスト: キャプチャ=0円(Apple内蔵API) / 翻訳=Claudeサブスク内(API課金なし) / 全データはローカル、クラウド送信なし</text>
<text x="40" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8a8a8a" text-anchor="start">なぜ10分と45分? リアルタイムは10分刻み+前回の続きを持ち越し(未来を見ない因果処理)。過去のまとめ読みは45分=LLMが一度に読み切れて、タスクが3〜10個入る自然な塊。</text>
<text x="40" y="524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#8a8a8a" text-anchor="start">精度0.888は実データ16エピソード(12日分)のベンチで実測(検証一式は同梱のmemoria-lab設計に基づく)。</text></svg>